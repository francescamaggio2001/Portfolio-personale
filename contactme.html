<main>
    <section class="contact-intro">
    <div class="contact-intro-content d-flex flex-column align-items-center text-center">
        <h2>Let's create something meaningful.</h2>
    </div>
    </section>

    
<section class="contact-form-section">

    <form id="contact-form" class="contact-form d-flex flex-column">

        <!-- Nome -->
        <div class="form-group d-flex flex-column">
            <label for="full-name">Full Name</label>
            <input
                class="form-control"
                type="text"
                id="full-name"
                name="name"
                placeholder="Your name"
                autocomplete="name"
                required
            >
        </div>

        <!-- Email -->
        <div class="form-group d-flex flex-column">
            <label for="email">E-mail</label>
            <input
                class="form-control"
                type="email"
                id="email"
                name="email"
                placeholder="Your email address"
                autocomplete="email"
                required
            >
        </div>

        <!-- Messaggio -->
        <div class="form-group d-flex flex-column">
            <label for="message">Tell me about your project</label>
            <textarea
                class="form-control"
                id="message"
                name="message"
                placeholder="Write your message here..."
                rows="6"
                required
            ></textarea>
        </div>

        <!-- Pulsante -->
        <button type="submit" class="btn contact-submit">
            Share your idea
        </button>

        <!-- Messaggio di conferma o errore -->
        <p
            id="form-status"
            role="status"
            aria-live="polite"
        ></p>

    </form>

</section>
